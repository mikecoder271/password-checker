<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Shield Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="card">
        <!-- 1. Analyzer Section -->
        <div class="card-header">
            <h2>Password Core</h2>
            <p class="subtitle">Security Metrics Engine</p>
        </div>

        <div class="input-container">
            <input type="password" id="password" placeholder="System credential...">
            <button id="toggle-btn" type="button">Show</button>
        </div>
        
        <div class="meter-container">
            <div id="strength-bar"></div>
        </div>
        <p id="feedback-text">Awaiting input entry...</p>
        
        <!-- Crack Time Feature -->
        <div class="crack-time-display">
            Crack Time Estimate: <span id="crack-time-value">0 seconds</span>
        </div>

        <ul class="requirements">
            <li id="req-length"><span class="indicator"></span>Minimum 8 characters</li>
            <li id="req-upper"><span class="indicator"></span>At least 1 uppercase letter</li>
            <li id="req-number"><span class="indicator"></span>At least 1 number</li>
            <li id="req-special"><span class="indicator"></span>At least 1 special character</li>
        </ul>

        <!-- 2. Generator Section (New) -->
        <div class="generator-section">
            <h3>Secure Generator</h3>
            <div class="slider-container">
                <label>Length: <span id="length-val">16</span></label>
                <input type="range" id="gen-length" min="6" max="32" value="16">
            </div>
            <button id="generate-btn" type="button">Generate & Copy</button>
            <p id="gen-success-msg"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
