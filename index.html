<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Shield Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Vivid ambient light source simulation behind the card -->
    <div class="ambient-glow"></div>

    <div class="card">
        <div class="card-header">
            <h2>Password Core</h2>
            <p class="subtitle">Security Metrics Engine</p>
        </div>

        <div class="input-container">
            <input type="password" id="password" placeholder="System credential...">
            <button id="toggle-btn" type="button">Show</button>
        </div>
        
        <div class="meter-container">
            <div id="strength-bar"></div>
        </div>
        <p id="feedback-text">Awaiting input entry...</p>

        <ul class="requirements">
            <li id="req-length"><span class="indicator"></span>Minimum 8 characters</li>
            <li id="req-upper"><span class="indicator"></span>At least 1 uppercase letter</li>
            <li id="req-number"><span class="indicator"></span>At least 1 number</li>
            <li id="req-special"><span class="indicator"></span>At least 1 special character</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
